plugins {
    id 'java-library'

    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'

    id 'maven-publish'
}

group = 'org.receiverman'
version = '0.1.0-SNAPSHOT'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    api libs.slf4j.api

    // Use TestNG framework, also requires calling test.useTestNG() below
    testImplementation libs.testng
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
    withJavadocJar()
}

base {
    archivesName = 'receiverman'
}

application {
    // Define the main class for the application.
    mainClass = 'org.receiverman.ReceiverMan'
}

tasks.named('test') {
    // Use TestNG for unit tests.
    useTestNG()
}

sourceSets {
    hapiTest {
        java.srcDir 'src/hapiTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    hapiTestImplementation.extendsFrom testImplementation
    hapiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    hapiTestImplementation libs.hapi.base
    hapiTestImplementation libs.hapi.structures.v25
    hapiTestRuntimeOnly libs.slf4j.simple
}

tasks.register('hapiTest', Test) {
    description = 'Runs optional HAPI HL7 receiver integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.hapiTest.output.classesDirs
    classpath = sourceSets.hapiTest.runtimeClasspath
    useTestNG()
    shouldRunAfter test
}

tasks.register('debugHapiTest', Test) {
    description = 'Runs the HAPI ReceiverMan integration test and waits for a debugger on port 5005.'
    group = 'verification'
    testClassesDirs = sourceSets.hapiTest.output.classesDirs
    classpath = sourceSets.hapiTest.runtimeClasspath
    useTestNG()
    shouldRunAfter test
    outputs.upToDateWhen { false }
    filter {
        includeTestsMatching 'org.receiverman.ReceiverManHapiReceiverTest.hapiSimpleServerCanFeedReceiverManBus'
    }
    debugOptions {
        enabled = true
        host = '*'
        port = 5005
        server = true
        suspend = true
    }
}

tasks.named('run') {
    standardInput = System.in
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'receiverman'

            pom {
                name = 'ReceiverMan'
                description = 'A stream contract verifier for supplier event feeds.'
            }
        }
    }
}
